# Adds leaderboard submissions to docs/leaderboard.json, which the GitHub
# Pages site shows.  Submissions arrive two ways:
#   * an issue made from the "Submit a leaderboard score" or "Submit an
#     Extra Credit score" form
#   * the Discord bot (discord/worker.js), as a repository_dispatch event
#     (/score -> discord-score, /extra -> discord-extra)
#   * Recomp Achievements Online, through the same worker (online-score,
#     online-extra), and /link moving a save's rows (online-link)
# Nothing here contacts RetroAchievements.
name: Leaderboard

on:
  issues:
    types: [opened, edited, reopened]
  repository_dispatch:
    types: [discord-score, discord-extra, online-score, online-extra, online-link]

permissions:
  contents: write
  issues: write

# No concurrency group: GitHub keeps only one waiting run per group and
# cancels the rest, which would drop submissions when several arrive at once
# (the online add-on sends two per save). Each run instead reads the latest
# board, adds its entry and pushes, and starts again from the new board if
# someone else pushed first.
jobs:
  ingest:
    if: >-
      github.event_name == 'repository_dispatch' ||
      contains(github.event.issue.labels.*.name, 'score') ||
      contains(github.event.issue.labels.*.name, 'extra') ||
      startsWith(github.event.issue.title, '[Score]') ||
      startsWith(github.event.issue.title, '[Extra]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script reads the submission straight from the event file.
      # Nothing from it goes into the command line or environment, so a
      # submission can't inject commands and the Discord reply token never
      # appears in this (public) log.
      # Exit 0 = added, 1 = rejected (the player gets the reason), 2 = bug.
      - name: Check the submission and save the board
        id: ingest
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved=false
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            python3 tools/leaderboard_ingest.py --event "$GITHUB_EVENT_PATH" \
              --board docs/leaderboard.json --reply "$RUNNER_TEMP/reply.md"
            rc=$?
            [ "$rc" = 0 ] || break
            git add docs/leaderboard.json
            if git diff --cached --quiet; then saved=true; break; fi
            git commit -q -m "Leaderboard: ${{ github.event_name == 'repository_dispatch' && github.event.action || format('issue #{0}', github.event.issue.number) }}"
            if git push -q; then saved=true; break; fi
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          echo "saved=$saved" >> "$GITHUB_OUTPUT"

      - name: Reply on the issue
        if: >-
          always() && github.event_name == 'issues' &&
          steps.ingest.outcome == 'success' &&
          (steps.ingest.outputs.ok != 'true' || steps.ingest.outputs.saved == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OK: ${{ steps.ingest.outputs.ok }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          if [ "$OK" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      # Online sends have no Discord message to answer.
      - name: Reply in Discord
        if: >-
          always() && github.event_name == 'repository_dispatch' &&
          github.event.client_payload.token &&
          steps.ingest.outcome == 'success'
        run: |
          if [ "${{ steps.ingest.outputs.ok }}" = "true" ] && [ "${{ steps.ingest.outputs.saved }}" != "true" ]; then
            echo "Something went wrong saving the board. The maintainer will take a look." > "$RUNNER_TEMP/reply.md"
          fi
          python3 tools/discord_reply.py --event "$GITHUB_EVENT_PATH" --reply "$RUNNER_TEMP/reply.md"

      # Mark the run failed on a bug, or a board that never saved, so the
      # repo owner gets GitHub's failed-workflow email.
      - name: Fail on an unexpected error
        if: steps.ingest.outputs.rc == '2' || (steps.ingest.outputs.ok == 'true' && steps.ingest.outputs.saved != 'true')
        run: exit 1
