# Cloudflare Worker for the leaderboard's Discord bot.  See discord/README.md.
name = "recomp-achievements-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_REPO = "ElvieBlooms/recomp_achievements"
BOARD_URL = "https://elvieblooms.github.io/recomp_achievements/"

# Secrets, set with `npx wrangler secret put NAME` (never put them here):
#   DISCORD_PUBLIC_KEY, GITHUB_TOKEN, OWNER_SALT

# For Recomp Achievements Online (see discord/README.md):
# /link keeps its codes here. Create it with
#   npx wrangler kv namespace create LINKS
# and put the id it prints below.
[[kv_namespaces]]
 binding = "LINKS"
 id = "279fc56c81034a3497a0b4f660bb98d5"
#
# Caps sends per save. The namespace_id is any number you choose.
 [[ratelimits]]
 name = "AUTO_LIMIT"
 namespace_id = "1001"
 simple = { limit = 10, period = 60 }
